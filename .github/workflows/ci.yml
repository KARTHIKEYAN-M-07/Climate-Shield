name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=src --cov-report=term-missing tests/

      - name: Run Ingest-to-Display Latency Benchmark
        run: |
          python -m src.monitoring.benchmark_latency

      - name: Generate Model Card & Data Sheet
        run: |
          python -m src.cli generate-cards

      - name: Verify Reports Integrity
        run: |
          test -f reports/latency.json
          test -f reports/model_card.md
          test -f reports/data_sheet.md

# =============================================================================
# configs/stations.yaml
# Multi-station and multi-basin configuration for Tamil Nadu River Basins.
#
# Provenance & Verification:
#   - Coordinates verified against official Survey of India / CWC basin maps.
#   - GloFAS grid-cell resolution is ~0.05° (~5 km).
#   - Grid-snap check queries 3x3 surrounding cells to select optimal channel cell.
#   - If modelled discharge is near-zero or flat, station is marked EXCLUDED.
# =============================================================================

stations:
  # ── Cauvery Basin ─────────────────────────────────────────────────────────
  - id: "TN_CAU_TRICHY"
    name: "Cauvery at Tiruchirappalli (Trichy)"
    river: "Cauvery"
    basin: "Cauvery"
    state: "Tamil Nadu"
    latitude: 10.7905
    longitude: 78.7047
    source: "CWC Gauge Site Reference / Open-Meteo GloFAS"
    coordinates_verified_by: "Survey of India Toposheets & CWC River Basin Atlas"
    elevation_m: 88
    status: "active"
    notes: "Major gauging site below Upper Anicut (Mukkombu) and Grand Anicut."

  - id: "TN_CAU_METTUR"
    name: "Cauvery at Mettur Dam (downstream)"
    river: "Cauvery"
    basin: "Cauvery"
    state: "Tamil Nadu"
    latitude: 11.7932
    longitude: 77.8013
    source: "Water Resources Department TN / Open-Meteo GloFAS"
    coordinates_verified_by: "WRD TN Reservoir Records & SOI"
    elevation_m: 205
    status: "active"
    notes: "Downstream release monitoring point from Stanley Reservoir."

  - id: "TN_CAU_MUSIRI"
    name: "Cauvery at Musiri"
    river: "Cauvery"
    basin: "Cauvery"
    state: "Tamil Nadu"
    latitude: 10.9554
    longitude: 78.4432
    source: "CWC Cauvery Basin Atlas / Open-Meteo GloFAS"
    coordinates_verified_by: "CWC Cauvery Basin Station Directory"
    elevation_m: 95
    status: "active"
    notes: "Intermediate monitoring point between Mettur and Grand Anicut."

  # ── Vaigai Basin ──────────────────────────────────────────────────────────
  - id: "TN_VAI_MADURAI"
    name: "Vaigai at Madurai"
    river: "Vaigai"
    basin: "Vaigai"
    state: "Tamil Nadu"
    latitude: 9.9252
    longitude: 78.1198
    source: "CWC Vaigai Basin Directory / Open-Meteo GloFAS"
    coordinates_verified_by: "CWC / WRD TN Madurai Division"
    elevation_m: 136
    status: "active"
    notes: "Main urban channel monitoring point for Vaigai basin."

  # ── Thamirabarani Basin ───────────────────────────────────────────────────
  - id: "TN_THA_TIRUNELVELI"
    name: "Thamirabarani at Tirunelveli"
    river: "Thamirabarani"
    basin: "Thamirabarani"
    state: "Tamil Nadu"
    latitude: 8.7274
    longitude: 77.7280
    source: "CWC Minor Rivers Basin Atlas / Open-Meteo GloFAS"
    coordinates_verified_by: "WRD TN Tirunelveli Circle"
    elevation_m: 47
    status: "active"
    notes: "Perennial river monitoring site in southern Tamil Nadu."

  # ── Palar Basin ───────────────────────────────────────────────────────────
  - id: "TN_PAL_VELLORE"
    name: "Palar at Vellore"
    river: "Palar"
    basin: "Palar"
    state: "Tamil Nadu"
    latitude: 12.9165
    longitude: 79.1325
    source: "CWC Palar Basin Atlas / Open-Meteo GloFAS"
    coordinates_verified_by: "CWC Station Directory"
    elevation_m: 216
    status: "active"
    notes: "Ephemeral non-perennial river channel in northern Tamil Nadu."

  # ── Adyar Basin (Chennai) ─────────────────────────────────────────────────
  - id: "TN_ADY_CHENNAI"
    name: "Adyar at Chennai"
    river: "Adyar"
    basin: "Chennai Basin"
    state: "Tamil Nadu"
    latitude: 13.0067
    longitude: 80.2570
    source: "CMDA & WRD Chennai Division"
    coordinates_verified_by: "Survey of India Chennai Urban Toposheet"
    elevation_m: 6
    status: "candidate"
    notes: "Small coastal basin; subjected to grid-snap resolution filter."

  # ── Bhavani (Cauvery Tributary) ───────────────────────────────────────────
  - id: "TN_BHA_BHAVANI"
    name: "Bhavani at Bhavani Confluence"
    river: "Bhavani"
    basin: "Cauvery"
    state: "Tamil Nadu"
    latitude: 11.4500
    longitude: 77.6833
    source: "CWC Cauvery Basin Atlas / Open-Meteo GloFAS"
    coordinates_verified_by: "CWC Cauvery Basin Station Directory"
    elevation_m: 170
    status: "candidate"
    notes: "Major tributary confluence point."

  # ── Noyyal (Cauvery Tributary) ────────────────────────────────────────────
  - id: "TN_NOY_TIRUPPUR"
    name: "Noyyal at Tiruppur"
    river: "Noyyal"
    basin: "Cauvery"
    state: "Tamil Nadu"
    latitude: 11.1085
    longitude: 77.3411
    source: "WRD TN Noyyal Sub-basin"
    coordinates_verified_by: "WRD TN / SOI"
    elevation_m: 295
    status: "candidate"
    notes: "Ephemeral tributary subject to low GloFAS channel grid resolution."

# Grid-snap and resolution threshold settings
grid_snap:
  grid_step_deg: 0.05             # ~5 km GloFAS resolution
  search_radius_cells: 1          # 3x3 search window (-1, 0, +1)
  min_mean_discharge_m3s: 1.0     # Mean discharge below this -> excluded (too small for model)
  min_max_discharge_m3s: 5.0      # Peak discharge below this -> excluded (flat signal)
  exclusion_message: "River channel too small for GloFAS model resolution (~5 km grid)."

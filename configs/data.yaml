default_station_id: TN_CAU_TRICHY
period:
  start: '2014-01-01'
  end: '2026-10-28'
rainfall_api:
  base_url: https://archive-api.open-meteo.com/v1/archive
  variables:
  - precipitation_sum
  units:
    precipitation: mm/day
  cadence: daily
  timeout_s: 30
  max_retries: 3
  backoff_factor: 2
  rate_limit_pause_s: 65
discharge_api:
  base_url: https://flood-api.open-meteo.com/v1/flood
  variables:
  - river_discharge
  units:
    river_discharge: m³/s
  cadence: daily
  timeout_s: 30
  max_retries: 3
  backoff_factor: 2
  rate_limit_pause_s: 65
cwc_gauge:
  enabled: false
  expected_columns:
  - timestamp
  - station_id
  - water_level_m
  units:
    water_level: m
paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: reports
  models_dir: models
filename_templates:
  raw_rainfall: '{station_id}_rainfall_raw_{date}.csv'
  raw_discharge: '{station_id}_discharge_raw_{date}.csv'
  validation_report: '{station_id}_{dataset}_validation_{date}.json'
validation:
  rainfall_min_mm: 0.0
  rainfall_max_mm: 600.0
  discharge_min_m3s: 0.0
  discharge_max_m3s: 50000.0
  max_missing_pct: 10.0
  max_consecutive_missing: 7
retrieval:
  last_run_utc: null
  retrieved_by: src/data/ingestion.py
  source_credit: Weather and flood data by Open-Meteo.com (CC BY 4.0)

staleness:
  max_data_age_hours: 48
  max_forecast_age_hours: 24
forecast_horizons_days:
- 1
- 3
- 7
station_signal_policy:
  min_rows: 500
  min_cv: 0.8
  min_p90_m3s: 0.2
  max_near_zero_share: 0.2
conformal_coverage:
  nominal_pct: 90.0
  min_acceptable_pct: 88.0
  under_coverage_warning: interval slightly under-covers on the test set
drift_risk_policy:
  out_of_distribution_action: LOW_CONFIDENCE
  z_score_threshold: 3.0
  psi_threshold: 0.25
  top_drifting_features_count: 3
  min_feature_std_floor: 0.05
  excluded_feature_patterns:
  - _flag
  method: same_season_percentiles
  season_window_days: 30
  reference_percentiles:
  - 1.0
  - 99.0
  min_features_outside_threshold: 2
  min_required_past_days: 30
  bias_tolerance_mae_mm: 5.0
coordinate_search_policy:
  grid_size: 7
  step_degrees: 0.05
  max_distance_km: 25.0
  training_start_date: '2014-01-01'
  training_end_date: '2022-12-22'
  ranking_metric: proximity_penalized_score
  require_signal_pass: true

metadata:
  version: 0.1.0
  source: prototype_percentile
  source_description: "Prototype statistical thresholds derived from training-set\
    \ percentiles of Open-Meteo modelled river discharge (m\xB3/s). NOT official CWC\
    \ warning or danger levels.\n"
  units: "m\xB3/s"
  discharge_type: modelled river discharge (Open-Meteo Flood API)
  last_updated: '2026-10-29T16:04:03.110547+00:00'
  caveat: 'These thresholds apply only to the specific station, training period, and
    Open-Meteo modelled data used in this project. They will differ from official
    CWC gauge-based thresholds.

    '
  last_recalibration_utc: '2026-10-29T15:27:23.089524+00:00'
  source_notice: prototype statistical thresholds, not official CWC levels
